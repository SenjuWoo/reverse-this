name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: catalog contract
        run: |
          python tests/test_catalog.py
          python tests/test_delivery.py

  installer-tests:
    name: installer (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: asset pattern self-test
        run: ./Install-Modkit.ps1 -SelfTest
      - name: plan prints the catalog
        run: ./Install-Modkit.ps1 -Plan
      - name: offline installer regression checks
        run: ./tests/test_installer.ps1
      - name: isolation configuration contract
        run: ./tests/test_isolation.ps1
      - name: real batch entrypoint regression checks
        run: ./tests/test_entrypoint.ps1
      - name: dotnet prerequisite regression checks
        run: ./tests/test_dotnet_prerequisite.ps1
      - name: standalone ownership, runtime and source-update boundaries
        run: ./tests/test_standalone.ps1

  installer:
    runs-on: ubuntu-latest
    needs: installer-tests
    if: always()
    steps:
      - name: require both PowerShell checks
        env:
          RESULT: ${{ needs.installer-tests.result }}
        run: test "$RESULT" = success
