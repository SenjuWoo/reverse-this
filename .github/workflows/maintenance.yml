name: maintenance

# Read-only drift check. It never edits the checkout or another owner's repo.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: catalog, encyclopedia and bundle contract
        run: |
          python tests/test_catalog.py
          python tests/test_encyclopedia.py
          python scripts/check_companions.py
      - name: critical upstream currency report
        run: python scripts/check_upstreams.py --json
